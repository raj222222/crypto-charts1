<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Live Crypto Chart - 42 Coins | Binance</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0a0a0a; font-family: 'Courier New', monospace; color: #e0e0e0; padding: 16px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .selector-page { text-align: center; padding: 40px 20px; }
        .selector-title { color: #fff; font-size: 32px; margin-bottom: 8px; }
        .selector-sub { color: #888; font-size: 14px; margin-bottom: 40px; }
        .coins-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 50px; }
        .coin-card { background: #1a1a1a; border-radius: 14px; padding: 20px 30px; cursor: pointer; transition: 0.2s; min-width: 120px; }
        .coin-card:hover { transform: scale(1.02); box-shadow: 0 0 12px rgba(255,255,255,0.1); }
        .coin-symbol { font-size: 22px; font-weight: bold; }
        .coin-name { font-size: 12px; color: #aaa; margin-top: 6px; }
        .coin-pair { font-size: 10px; color: #555; margin-top: 4px; }
        .footer-note { color: #333; font-size: 11px; margin-top: 50px; }
        .chart-page { display: none; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .back-btn { background: #1a1a1a; color: #aaa; border: 1px solid #ffaa00; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 12px; }
        .coin-title { font-size: 20px; margin: 0; }
        .est-clock { font-size: 14px; color: #ccc; }
        .kpi-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
        .kpi-card { background: #1a1a1a; border-radius: 8px; padding: 6px 14px; text-align: center; min-width: 90px; border: 1px solid; }
        .kpi-label { font-size: 10px; color: #888; }
        .kpi-value { font-size: 15px; font-weight: bold; }
        .controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-bottom: 12px; background: #111; padding: 10px; border-radius: 8px; }
        .control-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .control-label { color: #888; font-size: 13px; }
        .radio-group, .check-group { display: flex; flex-wrap: wrap; gap: 12px; }
        .radio-group label, .check-group label { font-size: 12px; cursor: pointer; }
        input[type="radio"], input[type="checkbox"] { margin-right: 4px; cursor: pointer; }
        button { background: #2a2a2a; border: 1px solid #555; color: #ddd; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        button:hover { background: #3a3a3a; }
        .entry-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .entry-input { background: #222; border: 1px solid #555; color: #fff; padding: 4px 8px; border-radius: 4px; width: 130px; }
        .pnl-display { font-weight: bold; }
        .chart-container { margin-top: 12px; background: #111; border-radius: 8px; padding: 8px; }
        #candle-chart { height: 460px; width: 100%; }
        #volume-chart { height: 150px; width: 100%; margin-top: 8px; }
        .source-label { color: #555; font-size: 10px; margin-top: 12px; text-align: right; }
        @media (max-width: 700px) { .coins-grid { gap: 12px; } .coin-card { padding: 12px 18px; min-width: 90px; } .coin-symbol { font-size: 16px; } .controls-row { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
<div class="container">
    <div id="selectorView" class="selector-page">
        <div class="selector-title">Live Crypto Chart</div>
        <div class="selector-sub">Select a cryptocurrency to view its live candlestick chart</div>
        <div class="coins-grid" id="coinsGrid"></div>
        <div class="footer-note">Powered by Binance API | Data refreshes every 5s</div>
    </div>

    <div id="chartView" class="chart-page">
        <div class="top-bar">
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
            <div class="coin-title" id="chartTitle">BTC/USDT Live Chart</div>
            <div class="est-clock" id="estClock"></div>
        </div>
        <div class="kpi-bar" id="kpiBar"></div>

        <div class="controls-row">
            <div class="control-group">
                <span class="control-label">Interval:</span>
                <div class="radio-group" id="intervalGroup"></div>
            </div>
            <div class="control-group">
                <span class="control-label">Indicators:</span>
                <div class="check-group" id="indicatorsGroup"></div>
            </div>
        </div>

        <div class="controls-row">
            <div class="control-group">
                <button id="savePresetBtn">💾 Save Preset</button>
                <button id="resetPresetBtn">🔄 Reset Preset</button>
                <button id="resetViewBtn">🔍 Reset View</button>
            </div>
            <div class="entry-group">
                <span class="control-label">Entry Price (USDT):</span>
                <input type="number" id="entryPriceInput" class="entry-input" placeholder="Set entry" step="any">
                <span id="pnlDisplay" class="pnl-display">No entry set</span>
            </div>
        </div>

        <div class="chart-container">
            <div id="candle-chart"></div>
            <div id="volume-chart"></div>
        </div>
        <div class="source-label" id="sourceLabel">Binance | Loading...</div>
    </div>
</div>

<script>
    // ----------------------------- 42 COINS -----------------------------
    const CRYPTO_LIST = {
        "BTC":   { name: "Bitcoin",          color: "#F7931A" }, "ETH":   { name: "Ethereum",         color: "#627EEA" },
        "SOL":   { name: "Solana",           color: "#00FFA3" }, "BNB":   { name: "Binance Coin",     color: "#F3BA2F" },
        "TRUMP": { name: "TRUMP Coin",       color: "#FFD700" }, "XRP":   { name: "XRP",              color: "#00AAFF" },
        "DOGE":  { name: "Dogecoin",         color: "#C3A634" }, "USDC":  { name: "USD Coin",         color: "#2775CA" },
        "ADA":   { name: "Cardano",          color: "#0033AD" }, "AVAX":  { name: "Avalanche",        color: "#E84142" },
        "SHIB":  { name: "Shiba Inu",        color: "#FF7300" }, "LTC":   { name: "Litecoin",         color: "#A5A9B4" },
        "UNI":   { name: "Uniswap",          color: "#FF007A" }, "LINK":  { name: "Chainlink",        color: "#2A5ADA" },
        "ATOM":  { name: "Cosmos",           color: "#2E3148" }, "FIL":   { name: "Filecoin",         color: "#0090FF" },
        "APT":   { name: "Aptos",            color: "#6B90D8" }, "ARB":   { name: "Arbitrum",         color: "#28A0F0" },
        "OP":    { name: "Optimism",         color: "#FF0420" }, "NEAR":  { name: "NEAR Protocol",    color: "#000000" },
        "INJ":   { name: "Injective",        color: "#00D8FF" }, "TRX":   { name: "TRON",             color: "#FF4444" },
        "VET":   { name: "VeChain",          color: "#00FF88" }, "KAS":   { name: "Kaspa",            color: "#CC44FF" },
        "XLM":   { name: "Stellar",          color: "#000000" }, "ZEC":   { name: "Zcash",            color: "#E6A23C" },
        "HBAR":  { name: "Hedera",           color: "#00B4D8" }, "DAI":   { name: "Dai",              color: "#F5AC37" },
        "FDUSD": { name: "First Digital USD", color: "#6B8E23" }, "USDE":  { name: "USDe",             color: "#9B59B6" },
        "ENA":   { name: "ENA",              color: "#2C3E50" }, "PEPE":  { name: "Pepe",             color: "#BDB76B" },
        "SUI":   { name: "Sui",              color: "#6FCF97" }, "CAKE":  { name: "PancakeSwap",      color: "#D1884F" },
        "KNC":   { name: "Kyber Network",    color: "#30E8C0" }, "XAUt":  { name: "Tether Gold",      color: "#F39606" },
        "FET":   { name: "Fetch.ai",         color: "#4F46E5" }, "RNDR":  { name: "Render",           color: "#FFA500" },
        "TIA":   { name: "Celestia",         color: "#F4A261" }, "MNT":   { name: "Mantle",           color: "#264653" },
        "STRK":  { name: "Starknet",         color: "#E9C46A" }
    };
    const SYMBOL_MAP = Object.fromEntries(Object.keys(CRYPTO_LIST).map(k => [k, k + "USDT"]));
    const INTERVALS = ["1m","2m","3m","5m","10m","15m","30m","1h","1d"];
    const DEFAULT_INTERVAL = "1m";
    const REFRESH_MS = 5000;
    const MAX_CANDLES = 100;

    let currentCoin = null, currentInterval = DEFAULT_INTERVAL, currentIndicators = ["ema9","ema21"];
    let entryPrice = null, tickerData = null, candleData = [], priceHistory = [], pollTimer = null;
    let candleChart = null, volumeChart = null, candleSeries = null, volumeSeries = null, indicatorLines = {};

    // localStorage presets (stores interval + indicators)
    function loadPresets() { const s = localStorage.getItem("crypto_presets"); return s ? JSON.parse(s) : {}; }
    function savePreset(coin, preset) { let p = loadPresets(); p[coin] = preset; localStorage.setItem("crypto_presets", JSON.stringify(p)); }
    function getPreset(coin) { return loadPresets()[coin] || null; }

    function updateCheckGroup(groupId, values) { document.querySelectorAll(`#${groupId} input[type="checkbox"]`).forEach(cb => cb.checked = values.includes(cb.value)); }
    function getCheckValues(groupId) { return Array.from(document.querySelectorAll(`#${groupId} input[type="checkbox"]:checked`)).map(cb => cb.value); }

    function applyPreset(coin) {
        const preset = getPreset(coin);
        if (preset) {
            currentInterval = preset.interval || DEFAULT_INTERVAL;
            currentIndicators = preset.indicators || ["ema9","ema21"];
        } else {
            currentInterval = DEFAULT_INTERVAL;
            currentIndicators = ["ema9","ema21"];
        }
        document.querySelectorAll('input[name="interval"]').forEach(r => { if (r.value === currentInterval) r.checked = true; });
        updateCheckGroup("indicatorsGroup", currentIndicators);
        if (currentCoin) fetchDataAndUpdate();
    }

    function resetChartView() { 
        if (candleChart && volumeChart) { 
            candleChart.timeScale().fitContent(); 
            volumeChart.timeScale().fitContent(); 
        } 
    }

    function syncVolumeRange() {
        if (!candleChart || !volumeChart) return;
        const range = candleChart.timeScale().getVisibleRange();
        if (range) volumeChart.timeScale().setVisibleRange(range);
    }

    function buildCoinSelector() {
        const grid = document.getElementById("coinsGrid");
        grid.innerHTML = "";
        for (const [symbol, info] of Object.entries(CRYPTO_LIST)) {
            const card = document.createElement("div");
            card.className = "coin-card";
            card.style.borderColor = info.color;
            card.innerHTML = `<div class="coin-symbol" style="color:${info.color}">${symbol}</div><div class="coin-name">${info.name}</div><div class="coin-pair">USDT</div>`;
            card.onclick = () => selectCoin(symbol);
            grid.appendChild(card);
        }
    }

    function selectCoin(coin) {
        if (pollTimer) clearInterval(pollTimer);
        currentCoin = coin;
        applyPreset(coin);
        document.getElementById("selectorView").style.display = "none";
        document.getElementById("chartView").style.display = "block";
        document.getElementById("chartTitle").innerHTML = `${CRYPTO_LIST[coin].name} (${coin}/USDT) Live Chart`;
        document.getElementById("chartTitle").style.color = CRYPTO_LIST[coin].color;
        candleData = []; priceHistory = []; entryPrice = null;
        document.getElementById("entryPriceInput").value = "";
        document.getElementById("pnlDisplay").innerHTML = "No entry set";
        if (candleSeries) candleSeries.setData([]);
        if (volumeSeries) volumeSeries.setData([]);
        for (let key in indicatorLines) if (indicatorLines[key]) candleChart?.removeSeries(indicatorLines[key]);
        indicatorLines = {};
        pollTimer = setInterval(() => fetchDataAndUpdate(), REFRESH_MS);
        fetchDataAndUpdate().then(() => resetChartView());
    }

    function goBack() {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = null;
        currentCoin = null;
        document.getElementById("selectorView").style.display = "block";
        document.getElementById("chartView").style.display = "none";
    }

    async function fetchCandles(symbol, interval) {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${MAX_CANDLES}`);
        const data = await res.json();
        return data.map(k => ({ time: Math.floor(k[0]/1000), open: parseFloat(k[1]), high: parseFloat(k[2]), low: parseFloat(k[3]), close: parseFloat(k[4]), volume: parseFloat(k[5]) }));
    }
    async function fetchTicker(symbol) {
        const res = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
        const data = await res.json();
        return { ltp: parseFloat(data.lastPrice), change_pct: parseFloat(data.priceChangePercent), high_24h: parseFloat(data.highPrice), low_24h: parseFloat(data.lowPrice), volume_24h: parseFloat(data.volume), bid: parseFloat(data.bidPrice), ask: parseFloat(data.askPrice) };
    }

    // Indicators
    function computeEMA(values, period) { let k=2/(period+1), ema=[], prev=values[0]; for(let i=0;i<values.length;i++) { if(i===0) ema[i]=values[i]; else ema[i]=values[i]*k+prev*(1-k); prev=ema[i]; } return ema; }
    function computeSMA(values, period) { let sma=[]; for(let i=0;i<values.length;i++) { if(i<period-1) sma[i]=null; else { let sum=0; for(let j=i-period+1;j<=i;j++) sum+=values[j]; sma[i]=sum/period; } } return sma; }
    function computeVWAP(candles) { let cumPV=0, cumVol=0, vwap=[]; for(let i=0;i<candles.length;i++) { const typical=(candles[i].high+candles[i].low+candles[i].close)/3; cumPV+=typical*candles[i].volume; cumVol+=candles[i].volume; vwap[i]=cumVol?cumPV/cumVol:candles[i].close; } return vwap; }
    function computeSuperTrend(candles, period=10, mult=3) {
        let tr=[]; for(let i=0;i<candles.length;i++) { if(i===0) tr[i]=candles[i].high-candles[i].low; else { const hl=candles[i].high-candles[i].low, hc=Math.abs(candles[i].high-candles[i-1].close), lc=Math.abs(candles[i].low-candles[i-1].close); tr[i]=Math.max(hl,hc,lc); } }
        let atr=[]; for(let i=0;i<candles.length;i++) { if(i<period-1) atr[i]=null; else { let sum=0; for(let j=i-period+1;j<=i;j++) sum+=tr[j]; atr[i]=sum/period; } }
        let src=candles.map(c=>(c.high+c.low)/2), upper=[], lower=[];
        for(let i=0;i<candles.length;i++) { upper[i]=src[i]+(atr[i]?mult*atr[i]:0); lower[i]=src[i]-(atr[i]?mult*atr[i]:0); }
        let st=[], trend=[]; for(let i=0;i<candles.length;i++) { if(i<period) { st[i]=null; trend[i]=1; } else { if(trend[i-1]===1) { if(candles[i].close<=lower[i]) { trend[i]=-1; st[i]=upper[i]; } else { trend[i]=1; st[i]=(upper[i]<st[i-1])?upper[i]:st[i-1]; } } else { if(candles[i].close>=upper[i]) { trend[i]=1; st[i]=lower[i]; } else { trend[i]=-1; st[i]=(lower[i]>st[i-1])?lower[i]:st[i-1]; } } } }
        return st;
    }

    function updateKPI(ticker, coin) {
        const bar = document.getElementById("kpiBar");
        if (!ticker) return;
        const color = CRYPTO_LIST[coin].color;
        const chgColor = ticker.change_pct >= 0 ? "#00ff88" : "#ff4444";
        let trend = "--";
        if (priceHistory.length >= 2) trend = priceHistory[priceHistory.length-1] > priceHistory[priceHistory.length-2] ? "UP" : (priceHistory[priceHistory.length-1] < priceHistory[priceHistory.length-2] ? "DN" : "--");
        const trendColor = trend === "UP" ? "#00ff88" : (trend === "DN" ? "#ff4444" : "#888");
        bar.innerHTML = `
            <div class="kpi-card" style="border-color:${color}"><div class="kpi-label">LTP</div><div class="kpi-value" style="color:${color}">$${ticker.ltp.toFixed(6)}</div></div>
            <div class="kpi-card" style="border-color:${chgColor}"><div class="kpi-label">24h Chng</div><div class="kpi-value" style="color:${chgColor}">${ticker.change_pct.toFixed(2)}%</div></div>
            <div class="kpi-card" style="border-color:${trendColor}"><div class="kpi-label">Trend</div><div class="kpi-value" style="color:${trendColor}">${trend}</div></div>
            <div class="kpi-card" style="border-color:#00ccff"><div class="kpi-label">24h High</div><div class="kpi-value" style="color:#00ccff">$${ticker.high_24h.toFixed(6)}</div></div>
            <div class="kpi-card" style="border-color:#ff8800"><div class="kpi-label">24h Low</div><div class="kpi-value" style="color:#ff8800">$${ticker.low_24h.toFixed(6)}</div></div>
            <div class="kpi-card" style="border-color:#aaffaa"><div class="kpi-label">Bid</div><div class="kpi-value" style="color:#aaffaa">$${ticker.bid.toFixed(6)}</div></div>
            <div class="kpi-card" style="border-color:#ffaaaa"><div class="kpi-label">Ask</div><div class="kpi-value" style="color:#ffaaaa">$${ticker.ask.toFixed(6)}</div></div>
        `;
    }

    async function fetchDataAndUpdate() {
        if (!currentCoin) return;
        const symbol = SYMBOL_MAP[currentCoin];
        try {
            const [candles, ticker] = await Promise.all([fetchCandles(symbol, currentInterval), fetchTicker(symbol)]);
            if (!candles.length) return;
            candleData = candles; tickerData = ticker;
            priceHistory.push(ticker.ltp); if (priceHistory.length > 5) priceHistory.shift();
            updateKPI(ticker, currentCoin);
            document.getElementById("sourceLabel").innerHTML = `Binance | ${currentCoin}/USDT | ${currentInterval} | Updated: ${new Date().toLocaleTimeString()}`;
            if (entryPrice !== null && !isNaN(entryPrice)) {
                const pnlAbs = ticker.ltp - entryPrice, pnlPct = (pnlAbs / entryPrice) * 100;
                document.getElementById("pnlDisplay").innerHTML = `<span style="color:${pnlAbs>=0?'#00ff88':'#ff4444'}">PnL: $${pnlAbs.toFixed(6)} (${pnlPct.toFixed(2)}%)</span>`;
            } else document.getElementById("pnlDisplay").innerHTML = "No entry set";
            renderCandles(candles, ticker);
        } catch(e) { console.error(e); }
    }

    function renderCandles(candles, ticker) {
        if (!candleChart) {
            candleChart = LightweightCharts.createChart(document.getElementById('candle-chart'), {
                layout: { background: { color: '#111' }, textColor: '#ccc' },
                grid: { vertLines: { color: '#1e1e1e' }, horzLines: { color: '#1e1e1e' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: '#333', scaleMargins: { top: 0.1, bottom: 0.1 } },
                timeScale: { borderColor: '#333', timeVisible: true, secondsVisible: false }
            });
            candleSeries = candleChart.addCandlestickSeries({ upColor: '#00ff88', downColor: '#ff4444', borderVisible: false, wickUpColor: '#00ff88', wickDownColor: '#ff4444' });
            
            volumeChart = LightweightCharts.createChart(document.getElementById('volume-chart'), {
                layout: { background: { color: '#111' }, textColor: '#ccc' },
                grid: { vertLines: { color: '#1e1e1e' }, horzLines: { color: '#1e1e1e' } },
                height: 150,
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { borderColor: '#333', timeVisible: true, visible: true }
            });
            volumeSeries = volumeChart.addHistogramSeries({ color: '#888', priceFormat: { type: 'volume' }, priceScaleId: '' });
            
            // Synchronize volume chart view with candle chart pan/zoom
            candleChart.timeScale().subscribeVisibleLogicalRangeChange((range) => {
                if (range) volumeChart.timeScale().setVisibleRange(range);
            });
        }

        // Update data
        const candleItems = candles.map(c => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close }));
        const volumeItems = candles.map(c => ({ time: c.time, value: c.volume, color: c.close >= c.open ? '#00ff88' : '#ff4444' }));
        candleSeries.setData(candleItems);
        volumeSeries.setData(volumeItems);

        // Force sync after data update (in case subscription missed)
        setTimeout(() => syncVolumeRange(), 10);

        // Remove old indicator lines
        for (let key in indicatorLines) if (indicatorLines[key]) candleChart.removeSeries(indicatorLines[key]);
        indicatorLines = {};

        const closes = candles.map(c => c.close);
        if (currentIndicators.includes("ema9") && candles.length >= 9) {
            const ema9 = computeEMA(closes, 9);
            const line = candleChart.addLineSeries({ color: '#00aaff', lineWidth: 1, title: 'EMA9' });
            line.setData(ema9.map((v,i) => ({ time: candles[i].time, value: v })));
            indicatorLines.ema9 = line;
        }
        if (currentIndicators.includes("ema21") && candles.length >= 21) {
            const ema21 = computeEMA(closes, 21);
            const line = candleChart.addLineSeries({ color: '#ff8800', lineWidth: 1, title: 'EMA21' });
            line.setData(ema21.map((v,i) => ({ time: candles[i].time, value: v })));
            indicatorLines.ema21 = line;
        }
        if (currentIndicators.includes("sma20") && candles.length >= 20) {
            const sma20 = computeSMA(closes, 20);
            const line = candleChart.addLineSeries({ color: '#ff66cc', lineWidth: 1, title: 'SMA20' });
            line.setData(sma20.map((v,i) => ({ time: candles[i].time, value: v })));
            indicatorLines.sma20 = line;
        }
        if (currentIndicators.includes("vwap") && candles.length > 0) {
            const vwap = computeVWAP(candles);
            const line = candleChart.addLineSeries({ color: '#ffaa33', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Solid, title: 'VWAP' });
            line.setData(vwap.map((v,i) => ({ time: candles[i].time, value: v })));
            indicatorLines.vwap = line;
        }
        if (currentIndicators.includes("supertrend") && candles.length >= 10) {
            const st = computeSuperTrend(candles, 10, 3);
            const line = candleChart.addLineSeries({ color: '#ff44ff', lineWidth: 1, title: 'SuperTrend' });
            line.setData(st.map((v,i) => ({ time: candles[i].time, value: v })));
            indicatorLines.supertrend = line;
        }

        // Entry line (orange) - keep this as user-requested feature
        if (entryPrice !== null && !isNaN(entryPrice)) {
            const entryLine = candleChart.addLineSeries({ color: '#ffaa00', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Solid, title: 'Entry' });
            entryLine.setData(candles.map(c => ({ time: c.time, value: entryPrice })));
            if (window.entryLineSeries) candleChart.removeSeries(window.entryLineSeries);
            window.entryLineSeries = entryLine;
        } else if (window.entryLineSeries) {
            candleChart.removeSeries(window.entryLineSeries);
            window.entryLineSeries = null;
        }
    }

    function initUI() {
        buildCoinSelector();
        const intervalDiv = document.getElementById("intervalGroup");
        intervalDiv.innerHTML = INTERVALS.map(iv => `<label><input type="radio" name="interval" value="${iv}"> ${iv} </label>`).join('');
        document.querySelectorAll('input[name="interval"]').forEach(r => r.addEventListener('change', (e) => { if(e.target.checked){ currentInterval=e.target.value; if(currentCoin) fetchDataAndUpdate().then(()=>resetChartView()); } }));
        
        const indDiv = document.getElementById("indicatorsGroup");
        indDiv.innerHTML = `<label><input type="checkbox" value="ema9"> EMA9</label>
                            <label><input type="checkbox" value="ema21"> EMA21</label>
                            <label><input type="checkbox" value="sma20"> SMA20</label>
                            <label><input type="checkbox" value="vwap"> VWAP</label>
                            <label><input type="checkbox" value="supertrend"> SuperTrend</label>`;
        indDiv.querySelectorAll('input').forEach(cb => cb.addEventListener('change', () => { currentIndicators = getCheckValues("indicatorsGroup"); if(currentCoin) fetchDataAndUpdate(); }));
        
        document.getElementById("savePresetBtn").onclick = () => { if(currentCoin) { savePreset(currentCoin, {interval:currentInterval, indicators:currentIndicators}); alert(`Preset saved for ${currentCoin}`); } };
        document.getElementById("resetPresetBtn").onclick = () => { if(currentCoin) { applyPreset(currentCoin); if(currentCoin) fetchDataAndUpdate().then(()=>resetChartView()); } };
        document.getElementById("resetViewBtn").onclick = () => resetChartView();
        
        document.getElementById("entryPriceInput").addEventListener('change', (e) => { let v=parseFloat(e.target.value); entryPrice=isNaN(v)?null:v; if(currentCoin) fetchDataAndUpdate(); });
        document.getElementById("backBtn").onclick = goBack;
        
        function updateClock() { let now=new Date(), est=new Date(now.toLocaleString("en-US",{timeZone:"America/New_York"})); document.getElementById("estClock").innerHTML=`EST: ${est.toLocaleString()}`; }
        updateClock(); setInterval(updateClock, 1000);
    }
    initUI();
</script>
</body>
</html>
